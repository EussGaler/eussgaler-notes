[project]
site_name = "EussGaler's Notes"
site_description = "控制、建模与数学基础的课程笔记"
site_author = "EussGaler"
site_url = "https://eussgaler.github.io/eussgaler-notes/"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
extra_css = ["stylesheets/notes.css", "stylesheets/home.css"]
extra_javascript = ["javascripts/mathjax.js", "vendor/mathjax/tex-mml-chtml.js", "javascripts/figures.js", "javascripts/home.js"]
nav = [
  { "首页" = "index.md" },
  { "课程笔记" = [
    "courses/index.md",
    { "控制理论中的代数基础" = [
      "courses/algebra-for-control/index.md",
      { "01 · 线性代数基础" = "courses/algebra-for-control/01-linear-algebra.md" },
      { "02 · 线性变换与商空间" = "courses/algebra-for-control/02-linear-maps.md" },
      { "03 · 内积空间与正交投影" = "courses/algebra-for-control/03-inner-products.md" },
    ] },
    { "系统建模与仿真" = [
      "courses/system-modeling/index.md",
      { "01 · 系统建模概述" = "courses/system-modeling/01-overview.md" },
      { "02 · 经典辨识" = "courses/system-modeling/02-classical-identification.md" },
      { "03 · 最小二乘法辨识" = "courses/system-modeling/03-least-squares.md" },
      { "04 · 极大似然辨识" = "courses/system-modeling/04-maximum-likelihood.md" },
      { "05 · 连续系统仿真数值方法" = "courses/system-modeling/05-numerical-methods.md" },
      { "06 · 一级倒立摆建模与 LQR 控制" = "courses/system-modeling/06-pendulum-lqr.md" },
    ] },
    { "自动控制理论 B" = [
      "courses/automatic-control-b/00-目录.md",
      { "01 · 控制系统的性能指标" = "courses/automatic-control-b/01-控制系统的性能指标.md" },
      { "02 · 基于频率特性的校正" = "courses/automatic-control-b/02-基于频率特性的校正.md" },
      { "03 · 基于根轨迹的校正" = "courses/automatic-control-b/03-基于根轨迹的校正.md" },
      { "04 · 离散控制系统的校正" = "courses/automatic-control-b/04-离散控制系统的校正.md" },
      { "05 · PID 控制器" = "courses/automatic-control-b/05-PID控制器.md" },
      { "06 · 能控性与能观性" = "courses/automatic-control-b/06-能控性与能观性.md" },
      { "07 · 状态空间综合" = "courses/automatic-control-b/07-状态空间综合.md" },
    ] },
  ] },
]

[project.theme]
custom_dir = "overrides"
variant = "modern"
language = "zh"
font = false
features = ["navigation.tabs", "navigation.indexes", "navigation.path", "navigation.top", "navigation.footer", "toc.follow", "content.code.copy"]

[project.extra]
generator = false

[[project.theme.palette]]
scheme = "default"
primary = "blue grey"
accent = "teal"
toggle.icon = "material/weather-night"
toggle.name = "切换至深色模式"

[[project.theme.palette]]
scheme = "slate"
primary = "blue grey"
accent = "teal"
toggle.icon = "material/weather-sunny"
toggle.name = "切换至浅色模式"

[project.markdown_extensions]
abbr = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
sane_lists = {}
pymdownx.arithmatex = { generic = true }
pymdownx.superfences = {}
pymdownx.highlight = { anchor_linenums = true }
toc = { permalink = true, toc_depth = 4 }
